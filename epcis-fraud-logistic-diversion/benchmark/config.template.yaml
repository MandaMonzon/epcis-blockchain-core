test:
  name: epcis-logistic-diversion-benchmark
  description: >
    Benchmark for EPCIS 2.0 logistics diversion smart contract.
    Submits ObjectEvent, AggregationEvent, and TransactionEvent events
    from the ARCOS DEA dataset with injected anomalies.
    Measures TPS and latency per event type and rule.
    txNumber escala dinamicamente com a quantidade real de eventos gerados.

  workers:
    number: 1

  rounds:
    - label: submitObjectEvent
      description: Submit ObjectEvent (commissioning / shipping / receiving)
      txNumber: __OBJ_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/submitEvent.js
        arguments:
          contractId: logistic-diversion
          channelName: mychannel
          runId: __RUN_ID__
          eventType: ObjectEvent
          eventsFile: /epcis-output/events.json

    - label: submitAggregationEvent
      description: Submit AggregationEvent (packing ADD / unpacking DELETE)
      txNumber: __AGG_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/submitEvent.js
        arguments:
          contractId: logistic-diversion
          channelName: mychannel
          runId: __RUN_ID__
          eventType: AggregationEvent
          eventsFile: /epcis-output/events.json

    - label: submitTransactionEvent
      description: Submit TransactionEvent (desadv / recadv)
      txNumber: __TXN_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/submitEvent.js
        arguments:
          contractId: logistic-diversion
          channelName: mychannel
          runId: __RUN_ID__
          eventType: TransactionEvent
          eventsFile: /epcis-output/events.json

    - label: getEvent
      description: Read one committed event by id
      txNumber: __READ_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: __READ_TPS__
      workload:
        module: workload/queryEvent.js
        arguments: &query
          contractId: logistic-diversion
          channelName: mychannel
          runId: __RUN_ID__
          label: getEvent
          queryFunction: getEvent

    - label: getProductState
      description: Read the latest state of an EPC
      txNumber: __READ_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: __READ_TPS__
      workload:
        module: workload/queryEvent.js
        arguments:
          <<: *query
          label: getProductState
          queryFunction: getProductState

    - label: getAuditSummary
      description: Full scan of the audit records (range query)
      txNumber: __SUMMARY_TX__
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workload/queryEvent.js
        arguments:
          <<: *query
          label: getAuditSummary
          queryFunction: getAuditSummary

    - label: stressLinearRate
      description: >
        Ramp the submit rate to locate the MVCC/timeout breaking point.
        Events are resubmitted under fresh ids, so this round adds state.
      txNumber: __LIN_TX__
      rateControl:
        type: linear-rate
        opts:
          startingTps: __LIN_START__
          finishingTps: __LIN_END__
      workload:
        module: workload/submitEvent.js
        arguments:
          contractId: logistic-diversion
          channelName: mychannel
          runId: __RUN_ID__
          label: stressLinearRate
          eventType: ObjectEvent
          eventsFile: /epcis-output/events.json
          maxRetries: 0

monitors:
  resource:
    - module: docker
      options:
        interval: 5
        containers:
          - peer0.org1.example.com
          - peer0.org2.example.com
          - orderer.example.com

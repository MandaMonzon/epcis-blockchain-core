name: epcis-fabric-network
version: "2.0.0"

caliper:
  blockchain: fabric

info:
  Version: 2.5.0
  Size: 2 orgs, 1 peer each
  Orderer: Solo
  Distribution: Single Host
  StateDB: GoLevelDB

channels:
  - channelName: mychannel
    contracts:
      - id: logistic-diversion
        version: "1.0"

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: User1
          clientPrivateKey:
            path: /blockchain-research/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/62f23223d7878d143f8cb5203ac30c78f7b14e64442ca2ba5b403f0726b11d9b_sk
          clientSignedCert:
            path: /blockchain-research/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/cert.pem
    connectionProfile:
      path: /blockchain-research/epcis-blockchain-core/epcis-fraud-logistic-diversion/benchmark/connection-org1-docker.yaml
      discover: true
